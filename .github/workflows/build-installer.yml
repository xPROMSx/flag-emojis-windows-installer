name: Windows installer

on:
  pull_request:
    paths:
      - "installer/**"
      - "tests/**"
      - ".github/workflows/build-installer.yml"
      - "docs/INSTALLER-TESTS.md"
      - "README.md"
      - "README_EN.md"
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "tests/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Windows EXE
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned font source and build contracts
        shell: pwsh
        run: |
          $script = Get-Content -LiteralPath installer/setup.iss -Raw
          $expectedHash = '83d29681ba6cb661500dbd1282f976cd4c498dc64479ba5d7a49877f40cabd19'
          if (-not $script.Contains($expectedHash)) { throw 'Pinned upstream SHA-256 missing' }
          if (-not $script.Contains('releases/download/v2.3.0/')) { throw 'Expected fixed upstream release missing' }
          if (-not $script.Contains("DefaultFont = 'seguiemj.ttf'")) { throw 'Original font mapping missing' }
          if (-not $script.Contains('UninstallNeedRestart')) { throw 'Uninstaller restoration hook missing' }

      - name: Compile using preinstalled Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found on runner' }
          & $iscc installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }
          # Negative download test variant: never uploaded/published.
          & $iscc /DTEST_UNREACHABLE_FONT installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Negative test installer compilation failed with exit code $LASTEXITCODE" }
          $exe = Get-ChildItem -LiteralPath dist -Filter 'FlagEmojisSetup-v*.exe' -File |
            Select-Object -First 1
          if (-not $exe) { throw 'Expected setup EXE not produced' }
          if ($exe.Length -lt 500000) { throw 'Produced EXE is unexpectedly small' }
          $hash = Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256
          "Installer: $($exe.Name)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "Size: $($exe.Length) bytes" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "SHA-256: $($hash.Hash)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload unsigned installer for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: FlagEmojisSetup-Windows
          path: dist/FlagEmojisSetup-v*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Smoke test install, repeat and uninstall on disposable runner
        shell: pwsh
        timeout-minutes: 9
        run: ./tests/smoke-installer.ps1

  publish:
    name: Publish v0.1.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FlagEmojisSetup-Windows
          path: dist
      - name: Publish tested installer to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.0 exists; not overwriting it."
            exit 0
          fi
          test -f dist/FlagEmojisSetup-v0.1.0.exe
          (cd dist && sha256sum FlagEmojisSetup-v0.1.0.exe > SHA256SUMS.txt)
          gh release create v0.1.0 \
            dist/FlagEmojisSetup-v0.1.0.exe \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Flag Emojis Windows Installer v0.1.0" \
            --notes-file docs/RELEASE-v0.1.0.md
